<!DOCTYPE html>
<html class="page-wiki-browse" lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<link rel="icon" href="/wiki-icon.png" type="image/png">
<title>Hostaka Wiki</title>
<script>
(function(){try{var t=localStorage.getItem('hostaka_theme')||'dark';document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light');}catch(e){}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/shared.css">
<link rel="stylesheet" href="/browse.css">
<link rel="stylesheet" href="/emoji.css">
<link rel="stylesheet" href="/openclaw.css">
<script src="/i18n.js"></script>
<script src="/modal.js"></script>
<script src="/emoji.js" defer></script>
<script src="/protect.js" defer></script>
</head>
<body class="page-wiki-browse">

<svg class="svg-sprite" aria-hidden="true" focusable="false">
  <symbol id="i-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4.5 4.5"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.5"/><path d="m21 15-5-5L5 21"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5"/><path d="M5 10v10h5v-6h4v6h5V10"/></symbol>
  <symbol id="i-terminal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></symbol>
  <symbol id="i-github" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 .5C5.73.5.5 5.73.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56v-2.17c-3.2.7-3.87-1.36-3.87-1.36-.52-1.33-1.28-1.68-1.28-1.68-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.23-1.28-5.23-5.7 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11.1 11.1 0 0 1 5.8 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.84 1.19 3.1 0 4.43-2.69 5.4-5.25 5.69.41.35.78 1.05.78 2.12v3.14c0 .31.21.68.8.56A11.5 11.5 0 0 0 23.5 12C23.5 5.73 18.27.5 12 .5z"/></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a15 15 0 0 1 4 9 15 15 0 0 1-4 9 15 15 0 0 1-4-9 15 15 0 0 1 4-9z"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></symbol>
  <symbol id="i-arrow-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m11 18-6-6 6-6"/></symbol>
  <symbol id="i-arrow-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  <symbol id="i-log-in" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></symbol>
</svg>

<div class="loader" id="loader"><div class="spinner"></div></div>

<header class="topbar">
  <button class="icon-btn sidebar-toggle" id="sidebar-toggle" type="button" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false" data-i18n-aria-label="common.openMenu" data-i18n-title="common.openMenu" title="Open menu">
    <svg class="icon"><use href="#i-menu"></use></svg>
  </button>

  <a href="/" class="brand">
    <img src="/wiki-icon.png" alt="Hostaka Wiki">
    <span class="brand-name" data-i18n="common.wiki">Wiki</span>
    <span class="brand-tag" data-i18n="common.hostaka">Hostaka</span>
  </a>

  <label class="search-box" for="searchInput">
    <svg class="icon" aria-hidden="true"><use href="#i-search"></use></svg>
    <input id="searchInput" type="search" autocomplete="off" placeholder="Search topics (e.g. chat-error)..." data-i18n-placeholder="browse.searchPlaceholder" oninput="onSearchInput()">
    <kbd>⌘K</kbd>
  </label>

  <nav class="topbar-nav" aria-label="Wiki">
    <a href="/" class="active" data-i18n="common.browse">Browse</a>
    <a href="/new" data-i18n="common.newPost">New post</a>
    <a href="https://laps.hostaka.fun" data-i18n="common.laps">LAPS</a>
  </nav>

  <a class="btn-primary topbar-cta" href="/new">
    <svg class="icon" aria-hidden="true"><use href="#i-plus"></use></svg>
    <span data-i18n="browse.newPost">Write a post</span>
  </a>

  <div class="topbar-actions">
    <a class="icon-btn" href="https://github.com/Misha-Chan/wiki" target="_blank" rel="noopener" aria-label="GitHub">
      <svg class="icon"><use href="#i-github"></use></svg>
    </a>
    <div class="lang-selector" id="langToggle">
      <button class="icon-btn" type="button" onclick="toggleLangMenu()" data-i18n-title="common.changeLanguage" data-i18n-aria-label="common.changeLanguage" title="Change language" aria-label="Change language">
        <svg class="icon" aria-hidden="true"><use href="#i-globe"></use></svg>
      </button>
      <div class="lang-menu" id="langMenu">
        <button type="button" onclick="setLang('ar')">العربية</button>
        <button type="button" onclick="setLang('en')">English</button>
      </div>
    </div>
    <button class="icon-btn" id="themeToggle" type="button" onclick="toggleTheme()" data-i18n-title="common.toggleTheme" data-i18n-aria-label="common.toggleTheme" title="Toggle theme" aria-label="Toggle theme">
      <svg class="icon theme-icon-sun" aria-hidden="true"><use href="#i-sun"></use></svg>
      <svg class="icon theme-icon-moon" aria-hidden="true"><use href="#i-moon"></use></svg>
    </button>
    <div id="authArea">
      <button class="icon-btn" type="button" onclick="goToLogin()" data-i18n-title="common.login" data-i18n-aria-label="common.login" title="Log in" aria-label="Log in">
        <svg class="icon" aria-hidden="true"><use href="#i-log-in"></use></svg>
      </button>
    </div>
  </div>
</header>

<div class="app-body">
  <aside class="sidebar" id="sidebar">
    <nav class="sidebar-nav" aria-label="Wiki navigation">
      <p class="sidebar-group" data-i18n="common.wiki">Wiki</p>

      <a class="sidebar-item active" href="/">
        <span class="sidebar-icon"><svg class="icon"><use href="#i-grid"></use></svg></span>
        <span data-i18n="common.browse">Browse</span>
      </a>

      <a class="sidebar-item" href="/new">
        <span class="sidebar-icon"><svg class="icon"><use href="#i-plus"></use></svg></span>
        <span data-i18n="common.newPost">New post</span>
      </a>

      <p class="sidebar-group" data-i18n="common.ecosystem">Ecosystem</p>

      <a class="sidebar-item" href="https://laps.hostaka.fun">
        <span class="sidebar-icon"><svg class="icon"><use href="#i-grid"></use></svg></span>
        <span data-i18n="common.laps">LAPS</span>
      </a>

      <a class="sidebar-item" href="https://laps.hostaka.fun/panya/">
        <span class="sidebar-icon"><svg class="icon"><use href="#i-image"></use></svg></span>
        <span data-i18n="common.panya">Panya</span>
      </a>

      <a class="sidebar-item" href="https://hostaka.fun">
        <span class="sidebar-icon"><svg class="icon"><use href="#i-home"></use></svg></span>
        <span data-i18n="common.hostaka">Hostaka</span>
      </a>

      <a class="sidebar-item" href="https://github.com/Misha-Chan/wiki" target="_blank" rel="noopener">
        <span class="sidebar-icon"><svg class="icon"><use href="#i-github"></use></svg></span>
        <span data-i18n="common.source">Source</span>
      </a>
    </nav>

    <div class="sidebar-foot">
      <span class="status-dot" aria-hidden="true"></span>
      <span data-i18n="common.allSystems">All systems normal</span>
    </div>
  </aside>

  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <main class="content">
    <div class="wiki-wrap">
      <div class="page-heading" data-i18n="browse.heading">Ask, answer, and document issues</div>
      <div class="page-sub" data-i18n="browse.sub">Search for a topic below, or start a new one.</div>
      <div id="extList"></div>
    </div>
  </main>
</div>

<div id="toastHost"></div>

<script src="/shared.js" defer></script>
<script src="/common.js" defer></script>
<script src="/browse.js" defer></script>
</body>
</html>
